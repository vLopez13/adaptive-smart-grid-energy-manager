<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumera</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="app-container" id="app-container">
        <!-- Header Section -->
        <header class="dashboard-header glass-panel">
            <div class="branding">
                <div class="status-indicator" id="connection-status"></div>
                <h1>Lumera</h1>
            </div>
            <div class="stream-data">
                <div class="data-card" id="data-card-clock">
                    <span class="label">Clock</span>
                    <span class="value" id="clock-display">--:--</span>
                </div>
                <div class="data-card" id="data-card-grid-price">
                    <span class="label">Grid Price</span>
                    <span class="value default-color" id="price-display">$0.000 <small>/kWh</small></span>
                </div>
                <div class="data-card" id="data-card-weather-temperature">
                    <span class="label">Temperature</span>
                    <span class="value default-color" id="temp-display">--.-°F</span>
                </div>
                <div id="user-profile"></div>
                <button id="logout-btn" class="secondary-btn logout">Logout</button>
            </div>
        </header>

        <!-- Energy Flow Visualizer -->
        <section class="energy-flow-panel glass-panel">
            <h2>Live Energy Flow</h2>
            <div class="svg-container">
                <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Nodes -->
                    <g class="node" id="node-solar" transform="translate(100, 100)">
                        <circle r="40" class="node-bg" />
                        <text y="60" text-anchor="middle">Solar</text>
                        <path d="M-15,-15 L15,15 M-15,15 L15,-15 M0,-20 L0,20 M-20,0 L20,0" stroke="var(--accent-yellow)" stroke-width="3"/>
                    </g>
                    <g class="node" id="node-grid" transform="translate(700, 100)">
                        <circle r="40" class="node-bg" />
                        <text y="60" text-anchor="middle">Grid</text>
                        <path d="M-20,10 L0,-15 L20,10 M0,-15 L0,20" stroke="var(--accent-blue)" stroke-width="3" fill="none"/>
                    </g>
                    <g class="node" id="node-battery" transform="translate(250, 300)">
                        <circle r="40" class="node-bg" />
                        <text y="60" text-anchor="middle">Battery</text>
                        <rect x="-15" y="-20" width="30" height="40" rx="3" stroke="var(--accent-green)" stroke-width="3" fill="none"/>
                        <rect x="-10" y="5" width="20" height="10" fill="var(--accent-green)" />
                    </g>
                    <g class="node" id="node-home" transform="translate(550, 300)">
                        <circle r="40" class="node-bg" />
                        <text y="60" text-anchor="middle">Home</text>
                        <path d="M-20,10 L0,-15 L20,10 L20,20 L-20,20 Z" stroke="var(--text-primary)" stroke-width="3" fill="none"/>
                    </g>

                    <!-- Flow Paths -->
                    <path id="flow-solar-battery" d="M140,100 L210,260" class="flow-path" />
                    <path id="flow-solar-home" d="M140,110 Q350,150 510,260" class="flow-path" />
                    <path id="flow-battery-home" d="M290,300 L510,300" class="flow-path" />
                    <path id="flow-grid-home" d="M660,110 Q450,150 590,260" class="flow-path" />
                    <path id="flow-battery-grid" d="M290,260 Q450,150 660,100" class="flow-path" />
                    <path id="flow-grid-battery" d="M660,100 Q450,150 290,260" class="flow-path" />
                </svg>
            </div>
        </section>

        <main class="dashboard-grid">
            <!-- Left Column: Active Decisions -->
            <section class="decisions-column">
                <div class="glass-panel main-action-panel">
                    <h2>Current Agent Decision</h2>
                    <div id="latest-action-container" class="waiting-state">
                        <div class="pulse-ring"></div>
                        <p id="action-status-text">Waiting for first decision...</p>
                    </div>
                </div>

                <div class="glass-panel guidelines-panel">
                    <h2>Preference Guidelines (<span id="guidelines-count">0</span>)</h2>
                    <p class="subtitle">Learned from user overrides</p>
                    <ul id="guidelines-list" class="guidelines-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </section>

            <!-- Right Column: History -->
            <section class="history-column glass-panel">
                <h2>Action History (Last 20)</h2>
                <div class="table-container">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Action</th>
                                <th>Reasoning Context</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
